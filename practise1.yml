- name: Install and configure nginx
  hosts: localhost
  become: true

  tasks:
    - name:  Install the nginx
      apt:
        name: nginx
        state: present
        update_cache: yes
  
    - name: Cpy the nginx confs
      copy:
        src: nginx.conf
        dest: /etc/nginx/nginx.conf
      notify: Restart nginx

    - name: Ensruing
      service:
        name: nginx
        state: started
        enabled: yes
  
  handlers:
    - name: Restart nginx
      service:
        name: nginx
        state: restarted
   
